[package]
name = "brainiac-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "brainiac_server"
path = "src/lib.rs"

[[bin]]
name = "brainiac"
path = "src/main.rs"

[dependencies]
brainiac-core = { workspace = true }
brainiac-fixtures = { workspace = true }
brainiac-store = { workspace = true }
brainiac-gateway = { workspace = true }
brainiac-pipeline = { workspace = true }
brainiac-publish = { workspace = true }
brainiac-eval = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
sha2 = { workspace = true }
utoipa = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
# Error tracking (test/production only; see init_sentry in main.rs). rustls-only
# to match the workspace TLS choice and avoid pulling native-tls/openssl.
sentry = { version = "0.48", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sentry-tracing = "0.48"

[dev-dependencies]
reqwest = { workspace = true }
brainiac-fixtures = { workspace = true }
brainiac-eval = { workspace = true }

[lints]
workspace = true
