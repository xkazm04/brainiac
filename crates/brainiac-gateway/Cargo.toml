[package]
name = "brainiac-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
brainiac-core = { path = "../brainiac-core" }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `blocking` powers the LightTrack telemetry worker thread (see src/lighttrack.rs);
# the provider calls themselves stay on the async client.
reqwest = { workspace = true, features = ["blocking"] }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Mock HTTP upstream for provider + resilience tests. 0.6 targets the hyper-1
# ecosystem already present in the lockfile (reqwest 0.12 / hyper 1.10), so it
# shares the existing dependency graph rather than pulling a second http stack.
wiremock = "0.6"

[lints]
workspace = true
