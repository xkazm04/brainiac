# Build-from-source OVERRIDE for docker-compose.deploy.yml.
#
# The deploy file pulls released images from GHCR. Layer this on top when you
# need to build locally instead — an unreleased commit, a fork, a patched
# Dockerfile, or a CPU architecture the release workflow doesn't publish:
#
#   docker compose -f docker-compose.deploy.yml -f docker-compose.build.yml \
#     --env-file .env.deploy up -d --build
#
# Why a separate file rather than `image:` + `build:` in one service: with both
# keys present, `compose up` builds whenever the image is merely absent locally
# and `compose pull` needs --ignore-buildable to behave — the deploy path would
# silently compile Rust for ~10 minutes on a 1 vCPU box the first time. Split
# this way, the default file has exactly one behaviour (pull) and building is
# always an explicit act.
#
# `image:` is repeated so the locally built artifact lands on the same tag the
# deploy file references — no tag drift between the two paths.

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/xkazm04/brainiac:${BRAINIAC_IMAGE_TAG:-latest}

  console:
    build:
      context: ./console
      dockerfile: Dockerfile
      # Console Sentry can ONLY be wired here. Next.js inlines `NEXT_PUBLIC_*`
      # at build time, so these must reach `npm run build` — a runtime env var
      # on the console service is substituted into nothing. Both are optional:
      # unset ⇒ empty ⇒ `if (dsn)` stays false and Sentry never initializes.
      # They reuse the SAME .env.deploy vars the Rust server reads at runtime,
      # so one DSN + one environment tag covers both halves of the stack.
      #
      # The same is true of Plausible: the console's funnel domain is inlined by
      # `next build`, so it can only arrive here. It reuses the SAME
      # PLAUSIBLE_DOMAIN / PLAUSIBLE_HOST vars the Rust server reads at runtime
      # for its own activation event — one site, one host, both halves of the
      # funnel, configured once in .env.deploy. Unset ⇒ empty ⇒ analytics off.
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN:-}
        NEXT_PUBLIC_BRAINIAC_ENV: ${BRAINIAC_ENV:-production}
        NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${PLAUSIBLE_DOMAIN:-}
        NEXT_PUBLIC_PLAUSIBLE_HOST: ${PLAUSIBLE_HOST:-}
    image: ghcr.io/xkazm04/brainiac-console:${BRAINIAC_IMAGE_TAG:-latest}
