[workspace]
resolver = "2"
members = [
    "crates/brainiac-core",
    "crates/brainiac-fixtures",
    "crates/brainiac-store",
    "crates/brainiac-gateway",
    "crates/brainiac-pipeline",
    "crates/brainiac-publish",
    "crates/brainiac-eval",
    "crates/brainiac-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/xkazm04/brainiac"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "io-std", "io-util"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
async-trait = "0.1"
sha2 = "0.11"
# Signing/crypto for the cloud-native gateway providers (Bedrock SigV4 = HMAC-SHA256;
# Vertex service-account auth = RS256 JWT → OAuth). All pure-Rust (no ring/OpenSSL/C
# toolchain) so the gateway still builds identically on Windows, macOS, and the slim
# Debian release image.
hmac = "0.12"
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
regex = "1"
schemars = { version = "1", features = ["chrono04"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }

# Internal crates
brainiac-core = { path = "crates/brainiac-core" }
brainiac-fixtures = { path = "crates/brainiac-fixtures" }
brainiac-store = { path = "crates/brainiac-store" }
brainiac-gateway = { path = "crates/brainiac-gateway" }
brainiac-pipeline = { path = "crates/brainiac-pipeline" }
brainiac-publish = { path = "crates/brainiac-publish" }
brainiac-eval = { path = "crates/brainiac-eval" }

[workspace.lints.clippy]
unwrap_used = "warn"

# Dev builds carry line tables only, not full debug info.
#
# Measured 2026-08-25 on this machine: this workspace's `target/` held 28.75 GB,
# of which 12.3 GB was MSVC `.pdb` debug symbols — 43% of the build tree, and
# the largest single class in it. Cargo's default for dev is `debug = true`,
# which on `x86_64-pc-windows-msvc` writes one complete packed PDB per binary,
# and a test-heavy workspace produces one binary per integration test file.
#
# `line-tables-only` keeps file:line in panic backtraces and `RUST_BACKTRACE`
# output — which is what CI, the test harness and any triage actually read.
# What it drops is variable and type inspection under a native debugger. If
# someone needs to attach WinDbg or rust-lldb to a binary here, raise this to
# `debug = 1` ("limited") for that session rather than deleting the line.
[profile.dev]
debug = "line-tables-only"
